<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="x-groc-version" content="v1.7">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">
<meta name="theme-color" content="#1f8a4c">
<title>Groceries</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1d211c;--sub:#6b7268;--line:#e3e6e0;--acc:#1f8a4c;--accsoft:#e3f3e9;--warn:#c25b12;--warnsoft:#fcefe3;--kid:#7a4fc0;--kidsoft:#efe8fa}
@media (prefers-color-scheme:dark){:root{--bg:#121411;--card:#1c1f1b;--ink:#eef0ec;--sub:#9aa196;--line:#2d322b;--acc:#45b673;--accsoft:#1d3325;--warn:#f0954a;--warnsoft:#3a2716;--kid:#b89af0;--kidsoft:#2c2440}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 86px)}
h1{font-size:28px;margin:4px 2px 10px;display:flex;align-items:center;gap:8px}
h1 .me{margin-left:auto;font-size:14px;font-weight:600;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);margin:22px 4px 8px;display:flex;align-items:center;gap:8px}
h2 .r{margin-left:auto;text-transform:none;letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .nm{font-weight:600;word-break:break-word}
.row .sb{font-size:14px;color:var(--sub);margin-top:2px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--acc);flex:none;background:none;padding:0}
.chk.on{background:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--accsoft);color:var(--acc);white-space:nowrap}
.btn.solid{background:var(--acc);color:#fff}
.btn.ghost{background:none;color:var(--sub);padding:9px 8px}
.btn.warn{background:var(--warnsoft);color:var(--warn)}
.btn.sm{padding:6px 11px;font-size:15px}
.add{display:flex;gap:8px;margin-bottom:4px}
.add input{flex:1;min-width:0;font:inherit;font-size:18px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.add .btn{font-size:18px;padding:0 18px}
.hint{font-size:14px;color:var(--sub);margin:6px 4px}
.empty{padding:18px 14px;color:var(--sub);text-align:center}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.tag.kid{background:var(--kidsoft);color:var(--kid)}
.tag.due{background:var(--warnsoft);color:var(--warn)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:13px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:22px;font-weight:400}
.tabs button.on{color:var(--acc);font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;z-index:11;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);display:none;-webkit-overflow-scrolling:touch}
.sheet.open,.scrim.open{display:block}
.sheet h3{margin:0 0 12px;font-size:22px;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto}
.f{margin:12px 0}
.f label{display:block;font-size:14px;font-weight:600;color:var(--sub);margin:0 2px 5px}
.f input,.f select,.f textarea{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.f textarea{min-height:150px}
.pair{display:flex;gap:8px;align-items:center}
.pair input{flex:1;min-width:0}
.pair span{color:var(--sub);white-space:nowrap}
.big{font-size:17px;background:var(--accsoft);color:var(--ink);border-radius:12px;padding:12px 14px;margin:10px 0}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font-size:15px;font-weight:600;color:var(--acc);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.log{font-size:14px;color:var(--sub);margin:0;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:9px 16px;font-weight:600}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 78px);background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;z-index:20;display:none;align-items:center;gap:10px;font-size:16px}
.toast.open{display:flex}
.toast .btn{margin-left:auto;background:none;color:var(--bg);text-decoration:underline;padding:0 4px}
.search{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
.ing{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.ing:first-child{border-top:0}
.ing input{width:24px;height:24px;flex:none;accent-color:var(--acc)}
.off{opacity:.55}
.gate{max-width:420px;margin:60px auto;text-align:center}
.gate p{color:var(--sub)}
.steps{margin:8px 0 0;padding-left:22px}
.steps li{margin:6px 0}
.ver{font-size:12px;color:var(--sub);text-align:center;margin-top:24px}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabs" id="tabs" style="display:none">
  <button data-tab="list" class="on"><b>🛒</b>List</button>
  <button data-tab="recipes"><b>🍳</b>Recipes</button>
  <button data-tab="settings"><b>⚙️</b>Settings</button>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"><span id="toastTxt"></span><button class="btn" id="toastBtn"></button></div>

<script>
var VERSION = 'v1.7';
var API_ROOT = 'https://api.jobhubgo.com/api/grocery';
var DAY = 86400000;
var STORES = ['Walmart', 'Target', "Sam's", 'Other'];
// Same numbers as lib/groceryAuto.ts: the server puts an item on the list by
// itself AUTO_DAYS before it runs out; "Not yet" holds it off SNOOZE_DAYS.
var AUTO_DAYS = 2, SNOOZE_DAYS = 3;

function hashArg(k) {
  var m = (location.hash || '').match(new RegExp('[#&]' + k + '=([^&]+)'));
  return m ? decodeURIComponent(m[1]) : '';
}
var HH = (hashArg('h') || '').toLowerCase().replace(/[^a-z0-9_-]/g, '');
var API = API_ROOT + '/' + HH;
var CACHE = 'groc-' + HH, QKEY = 'groc-q-' + HH, MEKEY = 'groc-me-' + HH;

var items = {};   // id -> { id, kind, data, updatedAt, deleted }
var since = 0;
var queue = [];   // ids waiting to be PUT
var tab = 'list';
var me = '';
var sheetOpen = false;
var lastType = 0;
var searchText = '';
var showAll = false;
var showSkipped = false;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function rid() { return Math.random().toString(36).slice(2, 10); }
function fmtDay(ms) { return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
function $(id) { return document.getElementById(id); }

// Matching key, the same rule as normName on the server (lib/groceryVoice.ts):
// "Eggs" = "egg", "Berries" = "berry". Used only to spot an item already on
// the list; new items are always made by the server's /say.
function normName(s) {
  var t = String(s || '').toLowerCase().replace(/[’]/g, "'").replace(/[^a-z0-9&' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  var w = t.split(' '), l = w[w.length - 1] || '';
  if (l.length > 3) {
    if (/ies$/.test(l)) l = l.slice(0, -3) + 'y';
    else if (/(ches|shes|xes|sses|oes)$/.test(l)) l = l.slice(0, -2);
    else if (/[^s]s$/.test(l)) l = l.slice(0, -1);
  }
  w[w.length - 1] = l;
  return w.join(' ');
}

/* ---------- storage + sync ---------- */
function saveLocal() {
  try { localStorage.setItem(CACHE, JSON.stringify({ items: items, since: since })); localStorage.setItem(QKEY, JSON.stringify(queue)); } catch (e) {}
}
function loadLocal() {
  try {
    var c = JSON.parse(localStorage.getItem(CACHE) || 'null');
    if (c) { items = c.items || {}; since = c.since || 0; }
    queue = JSON.parse(localStorage.getItem(QKEY) || '[]');
  } catch (e) {}
  me = localStorage.getItem(MEKEY) || '';
}
function all(kind) {
  var out = [];
  for (var id in items) { var x = items[id]; if (x.kind === kind && !x.deleted) out.push(x); }
  return out;
}
function busy() {
  var a = document.activeElement;
  return sheetOpen || Date.now() - lastType < 3000 || (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'));
}

function put(id, kind, data, deleted) {
  var x = { id: id, kind: kind, data: data, updatedAt: Date.now(), deleted: !!deleted };
  items[id] = x;
  if (queue.indexOf(id) < 0) queue.push(id);
  saveLocal();
  flush();
  return x;
}

var flushing = false;
function flush() {
  if (flushing || !queue.length || !HH) return;
  flushing = true;
  var id = queue[0], x = items[id];
  if (!x) { queue.shift(); flushing = false; saveLocal(); return flush(); }
  fetch(API + '/' + encodeURIComponent(id), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind: x.kind, data: x.data, updatedAt: x.updatedAt, deleted: x.deleted })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.stale && j.item) items[j.item.id] = j.item;
    if (j && (j.ok || j.stale)) queue.shift();
    else if (j && j.error) queue.shift(); // a bad row must not block the rest forever
    flushing = false; saveLocal();
    if (queue.length) flush();
  }).catch(function () { flushing = false; });
}

function pull(force) {
  if (!HH) return Promise.resolve();
  return fetch(API + '?since=' + Math.max(0, since - 15000), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.items) return;
      var changed = false;
      j.items.forEach(function (x) {
        var cur = items[x.id];
        if (queue.indexOf(x.id) >= 0 && cur && cur.updatedAt > x.updatedAt) return;
        if (!cur || x.updatedAt >= cur.updatedAt) {
          if (!cur || JSON.stringify(cur) !== JSON.stringify(x)) changed = true;
          items[x.id] = x;
        }
      });
      since = j.now || since;
      saveLocal();
      flush();
      if ((changed || force) && (force ? !sheetOpen : !busy())) render();
    }).catch(function () {});
}

/* ---------- people ---------- */
function people() { return all('person').sort(function (a, b) { return a.data.name.localeCompare(b.data.name); }); }
function personByName(n) { n = String(n || '').toLowerCase(); return people().filter(function (p) { return p.data.name.toLowerCase() === n; })[0]; }
function isKid() { var p = personByName(me); return !!(p && p.data.role === 'kid'); }
function addPerson(name, role) {
  name = String(name || '').trim();
  if (!name) return null;
  var p = personByName(name);
  if (p) return p;
  return put('p-' + normName(name).replace(/[^a-z0-9]+/g, '-'), 'person', { name: name, role: role || 'parent' });
}

/* ---------- how long a pack lasts ---------- */
function lifeFromRate(pack, perWeek) {
  pack = Number(pack); perWeek = Number(perWeek);
  if (!(pack > 0) || !(perWeek > 0)) return null;
  return Math.round(pack / perWeek * 7 * 10) / 10;
}
// track false = Skip, null = a receipt brought it in and nobody has said
// Track or Skip yet. Neither shows in the list's own sections or adds itself.
function tracked(d) { return d.track !== false && d.track !== null; }
function daysLeft(d) {
  if (!d.lifeDays || !d.lastBought) return null;
  return (d.lastBought + d.lifeDays * DAY - Date.now()) / DAY;
}
function lastsText(d) {
  if (!d.lifeDays) return '';
  var days = Math.round(d.lifeDays);
  var t = days >= 14 && days % 7 === 0 ? (days / 7) + ' weeks' : days === 7 ? '1 week' : days + ' day' + (days === 1 ? '' : 's');
  return (d.pack ? 'a pack of ' + d.pack + (d.unit ? ' ' + d.unit : '') : 'a pack') + ' lasts about ' + t;
}
function leftText(n) {
  if (n == null) return '';
  if (n <= 0.5) return 'probably out now';
  var d = Math.round(n);
  return 'out in about ' + d + ' day' + (d === 1 ? '' : 's');
}

/* ---------- Siri / add box ---------- */
function sayIt(body) {
  body.who = me || 'Someone';
  return fetch(API + '/say', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (j) { toast(j.said || 'Saved.'); return pull(true); })
    .catch(function () { toast("Couldn't reach the list. Check your signal and try again."); });
}

/* ---------- toast ---------- */
var toastT = 0;
function toast(msg, btn, fn) {
  $('toastTxt').textContent = msg;
  $('toastBtn').style.display = btn ? '' : 'none';
  $('toastBtn').textContent = btn || '';
  $('toastBtn').onclick = function () { $('toast').classList.remove('open'); if (fn) fn(); };
  $('toast').classList.add('open');
  clearTimeout(toastT);
  toastT = setTimeout(function () { $('toast').classList.remove('open'); }, btn ? 6000 : 3500);
}

/* ---------- render ---------- */
function render() {
  if (!HH) return renderGate();
  $('tabs').style.display = '';
  [].forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
  if (!me) return renderWho();
  var keepAdd = $('addIn') ? $('addIn').value : '';
  var y = window.scrollY;
  if (tab === 'list') renderList();
  else if (tab === 'recipes') renderRecipes();
  else renderSettings();
  if ($('addIn')) $('addIn').value = keepAdd;
  window.scrollTo(0, y);
}

function header(title) {
  return '<h1>' + title + '<button class="me" onclick="pickMe()">' + esc(me) + '</button></h1>';
}

function renderGate() {
  $('tabs').style.display = 'none';
  $('app').innerHTML = '<div class="gate"><h1 style="justify-content:center">🛒 Groceries</h1>' +
    '<p>This page needs your family\'s link. Ask whoever set it up to send it to you.</p>' +
    '<p style="margin-top:30px"><button class="btn" onclick="newList()">Start a new list</button></p></div>';
}
function newList() {
  var k = Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 8);
  location.hash = 'h=' + k;
  location.reload();
}

function renderWho() {
  var ps = people();
  $('app').innerHTML = '<h1>🛒 Groceries</h1><h2>Who\'s this?</h2>' +
    '<div class="chips" style="margin:0 2px">' + ps.map(function (p) {
      return '<button class="chip" onclick="setMe(\'' + esc(p.data.name).replace(/'/g, "\\'") + '\')">' + esc(p.data.name) + '</button>';
    }).join('') + '</div>' +
    '<div class="f" style="margin-top:22px"><label>' + (ps.length ? 'Someone new?' : 'Your first name') + '</label>' +
    '<div class="pair"><input id="whoIn" placeholder="First name" autocomplete="given-name"><button class="btn solid" onclick="newMe()">That\'s me</button></div></div>' +
    '<p class="hint">Everyone in the family uses this same link. Your name shows on what you add.</p>';
}
function setMe(n) { me = n; localStorage.setItem(MEKEY, n); render(); }
function newMe() {
  var n = $('whoIn').value.trim();
  if (!n) return;
  addPerson(n, 'parent');
  setMe(personByName(n).data.name);
}
function pickMe() { me = ''; localStorage.removeItem(MEKEY); render(); }

function renderList() {
  var its = all('item');
  var on = its.filter(function (x) { return x.data.onList; });
  var req = its.filter(function (x) { return !x.data.onList && x.data.requested; });
  var ask = its.filter(function (x) { return x.data.track === null && !x.data.onList; })
    .sort(function (a, b) { return (b.data.lastBought || 0) - (a.data.lastBought || 0); });
  var skipped = its.filter(function (x) { return x.data.track === false && !x.data.onList; })
    .sort(function (a, b) { return a.data.name.localeCompare(b.data.name); });
  var due = its.filter(function (x) {
    if (x.data.onList || x.data.requested || !tracked(x.data)) return false;
    // Same rule as autoDue: more than one whole pack life overdue = stopped buying it.
    var n = daysLeft(x.data); return n != null && n <= 6 && n >= -x.data.lifeDays;
  }).sort(function (a, b) { return daysLeft(a.data) - daysLeft(b.data); });

  var h = header('🛒 Groceries');
  h += '<div class="add"><input id="addIn" placeholder="What are we out of?" enterkeyhint="done" autocomplete="off"><button class="btn solid" onclick="addTyped()">Add</button></div>';
  h += '<p class="hint">Type a few at once: "ketchup, mustard and eggs". Or say "Hey Siri, Groceries".</p>';

  if (req.length) {
    h += '<h2>Asked for <span class="r"></span></h2><div class="card">' + req.map(function (x) {
      var d = x.data;
      return '<div class="row"><div class="main"><div class="nm">' + esc(d.name) + '<span class="tag kid">' + esc(d.requested.who) + '</span></div>' +
        '<div class="sb">' + (d.note ? esc(d.note) + ' · ' : '') + 'asked ' + fmtDay(d.requested.at) + '</div></div>' +
        (isKid() ? '<span class="sb">waiting</span>' :
          '<button class="btn sm" onclick="approve(\'' + x.id + '\')">OK</button><button class="btn sm ghost" onclick="deny(\'' + x.id + '\')">No</button>') +
        '</div>';
    }).join('') + '</div>';
  }

  h += '<h2>On the list · ' + on.length + '</h2>';
  if (!on.length) h += '<div class="card"><div class="empty">Nothing on the list. Add what you\'re out of above.</div></div>';
  STORES.forEach(function (s) {
    var g = on.filter(function (x) { return (STORES.indexOf(x.data.store) < 0 ? 'Other' : x.data.store) === s; })
      .sort(function (a, b) { return a.data.name.localeCompare(b.data.name); });
    if (!g.length) return;
    h += '<h2>' + esc(s) + ' · ' + g.length + '<span class="r"><button class="btn sm" onclick="copyStore(\'' + esc(s).replace(/'/g, "\\'") + '\')">Copy</button></span></h2><div class="card">' +
      g.map(function (x) {
        var d = x.data, sub = [];
        if (d.note) sub.push(esc(d.note));
        var auto = d.listedBy === 'Auto';
        if (auto) sub.push('added itself, ' + (leftText(daysLeft(d)) || 'running low'));
        else if (d.listedBy) sub.push(esc(d.listedBy));
        return '<div class="row"><button class="chk" onclick="bought(\'' + x.id + '\')" aria-label="Got it"></button>' +
          '<div class="main" onclick="openItem(\'' + x.id + '\')"><div class="nm">' + esc(d.name) + '</div>' +
          (sub.length ? '<div class="sb">' + sub.join(' · ') + '</div>' : '') + '</div>' +
          (auto ? '<button class="btn sm ghost" onclick="notYet(\'' + x.id + '\')">Not yet</button>' : '') + '</div>';
      }).join('') + '</div>';
  });

  if (due.length) {
    h += '<h2>Coming up</h2><div class="card">' +
      due.map(function (x) {
        var d = x.data, n = daysLeft(d);
        var when = d.snoozeUntil && d.snoozeUntil > Date.now() ? 'held off until ' + fmtDay(d.snoozeUntil)
          : n <= AUTO_DAYS ? 'adding itself now' : 'adds itself ' + fmtDay(d.lastBought + (d.lifeDays - AUTO_DAYS) * DAY);
        return '<div class="row"><div class="main" onclick="openItem(\'' + x.id + '\')"><div class="nm">' + esc(d.name) + '<span class="tag due">' + leftText(n) + '</span></div>' +
          '<div class="sb">' + when + '</div>' +
          '</div><button class="btn sm" onclick="addExisting(\'' + x.id + '\')">Add now</button></div>';
      }).join('') + '</div>';
  }

  if (ask.length) {
    h += '<h2>New from receipts: keep track of these?</h2><div class="card">' + ask.map(function (x) {
      var d = x.data;
      return '<div class="row"><div class="main" onclick="openItem(\'' + x.id + '\')"><div class="nm">' + esc(d.name) + '</div>' +
        '<div class="sb">' + (d.lastBought ? 'bought ' + fmtDay(d.lastBought) : '') + (d.store ? ' at ' + esc(d.store) : '') + '</div></div>' +
        '<button class="btn sm" onclick="setTrack(\'' + x.id + '\', true)">Track</button><button class="btn sm ghost" onclick="setTrack(\'' + x.id + '\', false)">Skip</button></div>';
    }).join('') + '</div><p class="hint">Track means the list learns how fast you use it and adds it before you run out. Skip means it ignores it from now on.</p>';
  }

  var rest = its.filter(function (x) { return !x.data.onList && tracked(x.data); }).sort(function (a, b) { return a.data.name.localeCompare(b.data.name); });

// "Not yet" on something the list added itself: we still have some, so a pack

function notYet(id) {

  if (d.lastBought && d.lifeDays) {

      d.lifeDays = Math.round((w ? (d.lifeDays * w + atLeast) / (w + 1) : atLeast) * 10) / 10;
      d.lifeN = (d.lifeN || 0) + 1;
      if (d.pack) d.perWeek = Math.round(d.pack / d.lifeDays * 7 * 10) / 10;

  d.onList = false; d.snoozeUntil = now + SNOOZE_DAYS * DAY;

var UNIT_RE = /^((?:\d+(?:[.\/]\d+)?|[½¼¾⅓⅔]|a|an|one|two|three|four)\s*(?:lbs?|pounds?|oz|ounces?|cups?|c\.|tbsp|tablespoons?|tsp|teaspoons?|cans?|packs?|packages?|boxes|box|bags?|jars?|cloves?|gallons?|bunch(?:es)?|dozen|sticks?|slices?|heads?|bottles?|pinch|dash)?\.?\s+(?:of\s+)?)/i;
function ingParse(line) {
  var t = String(line || '').replace(/^[-•*\s]+/, '').trim();
  if (!t) return null;
  var m = t.match(UNIT_RE);
  var name = m ? t.slice(m[0].length) : t;
  name = name.replace(/,.*$/, '').replace(/\(.*?\)/g, '').trim();
  if (!name) name = t;
  return { line: t, name: name.charAt(0).toUpperCase() + name.slice(1), qty: m ? m[0].replace(/\s+of\s*$/i, '').trim() : '' };
}

/* ---------- receipts from Yahoo ---------- */
var mailState = null;
// A failed check retries by itself (the server restarts for a minute when it
// updates), and offers Try again, so the box is never a dead end.
function drawMail(tries) {
  tries = tries || 0;
  fetch(API + '/mail', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (m) {
    mailState = m; paintMail();
  }).catch(function () {
    if (!$('mailCard')) return;
    if (tries < 3) { $('mailCard').innerHTML = '<div class="empty">Checking…</div>'; setTimeout(function () { if (tab === 'settings') drawMail(tries + 1); }, 5000); return; }
    $('mailCard').innerHTML = '<div class="empty">Couldn\'t reach the list just now.<br><button class="btn" style="margin-top:10px" onclick="drawMail()">Try again</button></div>';
  });
}
function paintMail() {
  var el = $('mailCard'); if (!el || !mailState) return;
  var m = mailState, h = '<div style="padding:14px">';
  if (!m.connected) {
    if (isKid()) { el.innerHTML = '<div class="empty">A parent can connect this.</div>'; return; }
    h += '<p style="margin:0 0 8px">The list reads your Walmart, Target and Sam\'s emails and learns what you buy, how often, and what you paid. It opens no other email.</p>' +
      '<p style="margin:12px 0 6px"><b>First, get a code from Yahoo.</b> It is not your Yahoo password and you don\'t make it up. Yahoo makes it for you.</p>' +
      '<ol class="steps"><li>Tap <b>Open Yahoo security</b> below and sign in if it asks.</li>' +
      '<li>On the <b>Security</b> tab, scroll down to <b>External connections</b>, then <b>App passwords</b>.</li>' +
      '<li>Tap <b>Create app password</b>. Under App name type <b>Groceries</b>, then tap <b>Generate password</b>.</li>' +
      '<li>Yahoo shows a 16 character code. Tap Copy, then come back to this page.</li></ol>' +
      '<p style="margin:10px 0 14px"><a class="btn" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="https://login.yahoo.com/myaccount/security">Open Yahoo security ↗</a></p>' +
      '<p style="margin:0 0 4px"><b>Then paste it here.</b></p>' +
      '<div class="f"><label>Yahoo email</label><input id="mEmail" type="email" autocomplete="email" placeholder="you@yahoo.com"></div>' +
      '<div class="f"><label>The 16 character code from Yahoo</label><input id="mPass" type="password" autocomplete="off" placeholder="Paste the code"></div>' +
      '<p class="hint" id="mErr" style="color:var(--warn)"></p>' +
      '<button class="btn solid" id="mGo" onclick="connectMail()">Connect</button>' +
      '<p class="hint">You can turn it off here any time, or delete "Groceries" from App passwords in Yahoo and it stops working right away.</p>';
  } else {
    var st = m.status === 'bad-login' ? '<b style="color:var(--warn)">Yahoo stopped taking the app password.</b> Disconnect and connect again with a new one.'
      : m.status === 'error' ? 'Couldn\'t reach Yahoo last time, it will try again.'
      : m.status === 'new' ? 'Reading your last 4 months of receipts. This can take a few minutes; this box updates by itself.'
      : 'Checks every 2 hours' + (m.lastRun ? ', last ' + new Date(m.lastRun).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '') + '.';
    h += '<p style="margin:0 0 6px">Reading <b>' + esc(m.email) + '</b></p><p class="hint" style="margin:0 0 12px">' + st + '</p>';
    var got = (m.receipts || []).filter(function (r) { return r.kind === 'purchase'; });
    if (got.length) h += '<ul class="log" style="margin-bottom:12px">' + got.slice(0, 6).map(function (r) {
      return '<li>' + fmtDay(r.at) + ' · ' + esc(r.store) + ' · ' + r.n + ' item' + (r.n === 1 ? '' : 's') + '</li>';
    }).join('') + '</ul>';
    if (!isKid()) h += '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="mRun" onclick="runMail()">Check now</button><button class="btn ghost" onclick="rereadMail()">Read all again</button><button class="btn ghost" onclick="dropMail()">Disconnect</button></div>';
  }
  el.innerHTML = h + '</div>';
  if (m.connected && m.status === 'new') setTimeout(function () { if (tab === 'settings' && !sheetOpen) drawMail(); }, 8000);
}
function connectMail() {
  var email = $('mEmail').value.trim(), pass = $('mPass').value.replace(/\s+/g, '');
  if (!email || !pass) { $('mErr').textContent = 'Fill in both.'; return; }
  $('mGo').disabled = true; $('mGo').textContent = 'Checking with Yahoo…'; $('mErr').textContent = '';
  fetch(API + '/mail', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: pass, who: me }) })
    .then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) { $('mErr').textContent = j.error || 'That didn\'t work.'; $('mGo').disabled = false; $('mGo').textContent = 'Connect'; return; }
      toast('Connected. Reading your receipts now.');
      drawMail();
    }).catch(function () { $('mErr').textContent = 'Couldn\'t reach the list. Try again.'; $('mGo').disabled = false; $('mGo').textContent = 'Connect'; });
}
function runMail() {
  $('mRun').disabled = true; $('mRun').textContent = 'Checking…';
  fetch(API + '/mail/run', { method: 'POST' }).then(function (r) { return r.json(); }).then(function (j) {
    toast(j.error ? 'Couldn\'t check right now.' : j.read ? 'Read ' + j.read + ' new email' + (j.read === 1 ? '' : 's') + '.' : 'Nothing new.');
    pull(true); drawMail();
  }).catch(function () { drawMail(); });
}
function rereadMail() {
  if (!confirm('Read the last 4 months of receipts again from the start? Things only receipts added get rebuilt; nothing you typed or set is touched.')) return;
  fetch(API + '/mail/reset', { method: 'POST' }).then(function (r) { return r.json(); }).then(function () {
    toast('Reading them again. This takes a few minutes.'); pull(true); drawMail();
  }).catch(function () { toast("Couldn't reach the list. Try again."); });
}
function dropMail() {
  if (!confirm('Stop reading receipts from Yahoo? What it already learned stays.')) return;
  fetch(API + '/mail', { method: 'DELETE' }).then(function () { drawMail(); });
}
function toggleKid(id) {
  var p = items[id]; if (!p) return;
  var d = clone(p.data); d.role = d.role === 'kid' ? 'parent' : 'kid';
  put(id, 'person', d); render();
}
function addP(role) {
  var n = $('newP').value.trim(); if (!n) return;
  var p = personByName(n);
  if (p) { var d = clone(p.data); d.role = role; put(p.id, 'person', d); } else addPerson(n, role);
  render();
}
function shareLink() {
  var url = location.origin + location.pathname + '#h=' + HH;
  if (navigator.share) navigator.share({ title: 'Groceries', text: 'Our grocery list', url: url }).catch(function () {});
  else (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { toast('Link copied.'); }).catch(function () { prompt('Copy this link:', url); });
}

/* ---------- boot ---------- */
[].forEach.call(document.querySelectorAll('.tabs button'), function (b) {
  b.onclick = function () { tab = b.dataset.tab; window.scrollTo(0, 0); render(); };
});
document.addEventListener('visibilitychange', function () { if (!document.hidden) pull(); });
document.addEventListener('input', function () { lastType = Date.now(); }, true);
window.addEventListener('hashchange', function () { location.reload(); });
loadLocal();
render();
if (HH) { pull().then(function () { if (!busy()) render(); }); setInterval(function () { if (!document.hidden) pull(); }, 15000); }
</script>
</body>
</html>
